name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hello-panda:latest

      - name: Verify Docker Image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hello-panda:latest
          docker run -d --name verify-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/hello-panda:latest
          sleep 5
          docker ps
          curl -I http://localhost:8080
          docker rm -f verify-app
